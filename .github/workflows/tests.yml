name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npx tsc --noEmit
      - run: npx eslint src tests scripts vitest.config.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-coverage
          path: coverage/
